[project]
name = "care_center"
authors = [
  {name="Dave Burkholder", email="dave@compassfoundation.io"},
]
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
preview = true

exclude = [
    "*/__manifest__.py",
]

[tool.ruff.lint]
ignore = [
    "F403",
    "F405",
    "F821",
]

dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.format]
quote-style = "preserve"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
    "E402",
    "F401",
    "F403",
]

[tool.ruff.lint.flake8-quotes]
multiline-quotes = "single"

[build-system]
requires = [
]
